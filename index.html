<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard DIKLAT - RSUD Bandung Kiwari</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for lightweight state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        navy: '#0f172a',
                        skyblue: '#0ea5e9',
                        darkbg: '#1e293b',
                        darkcard: '#334155'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        .nav-item.active { background-color: rgba(14, 165, 233, 0.1); border-right: 4px solid #0ea5e9; color: #0ea5e9;}
        .dark .nav-item.active { background-color: rgba(14, 165, 233, 0.2); }
        
        [x-cloak] { display: none !important; }
        
        /* Table Styles */
        .glass-table th { @apply bg-gray-50 dark:bg-darkbg text-gray-700 dark:text-gray-200 font-semibold text-sm py-3 px-4 text-left border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10; }
        .glass-table td { @apply py-3 px-4 border-b border-gray-100 dark:border-gray-700 text-sm text-gray-600 dark:text-gray-300; }
        .glass-table tr:hover { @apply bg-gray-50 dark:bg-gray-800 transition-colors; }

        /* Smooth Sidebar Transition */
        .sidebar-transition { transition: width 0.3s ease, transform 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-navy text-gray-800 dark:text-gray-100 transition-colors duration-300 overflow-hidden" x-data="appData()">

    <!-- LOGIN SCREEN -->
    <div x-show="!isLoggedIn" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50 backdrop-blur-sm">
        <div class="bg-white dark:bg-darkcard p-8 rounded-2xl shadow-2xl w-full max-w-md transform transition-all">
            <div class="text-center mb-8">
                <!-- Logo dari folder lokal dengan ukuran spesifik 4cm x 2cm -->
                <img src="img/rsudbk.png" alt="Logo RSUD Bandung Kiwari" class="mx-auto mb-4 rounded-lg object-contain" style="width: 4cm; height: 2cm;" onerror="this.src='https://placehold.co/150x75/0ea5e9/ffffff?text=RSUD+Bandung+Kiwari'">
                <h2 class="text-2xl font-bold text-navy dark:text-white">DIKLAT Dashboard</h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">Silakan masuk untuk melanjutkan</p>
            </div>
            <form @submit.prevent="login">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password Admin</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
                        <input type="password" x-model="loginPassword" class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-skyblue focus:border-skyblue dark:bg-darkbg dark:border-gray-600 dark:text-white outline-none transition-all" placeholder="Masukkan Password" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-skyblue hover:bg-blue-600 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APPLICATION -->
    <div x-show="isLoggedIn" x-cloak class="flex h-screen w-full">
        
        <!-- SIDEBAR -->
        <aside :class="sidebarOpen ? 'w-64 translate-x-0' : 'w-0 -translate-x-full md:w-0 md:-translate-x-full'" class="fixed inset-y-0 left-0 z-40 bg-white dark:bg-darkcard shadow-xl sidebar-transition flex flex-col overflow-hidden md:relative">
            <div class="p-5 flex items-center justify-between border-b border-gray-100 dark:border-gray-700 w-64 min-w-[16rem]">
                <div class="flex items-center gap-3">
                    <!-- Logo Mini dari folder lokal (2x2 cm) -->
                    <img src="img/rsudbk_mini.png" alt="Mini Logo" class="rounded object-contain" style="width: 2cm; height: 2cm;" onerror="this.src='https://placehold.co/75x75/0ea5e9/ffffff?text=Logo'">
                    <span class="font-bold text-lg tracking-wide text-navy dark:text-white">DIKLAT</span>
                </div>
                <button @click="sidebarOpen = false" class="md:hidden text-gray-500 hover:text-red-500">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="overflow-y-auto flex-1 py-4 px-3 space-y-1 w-64 min-w-[16rem]">
                <template x-for="item in menuItems" :key="item.id">
                    <div>
                        <!-- Single Link -->
                        <a x-show="!item.sub" @click="changeMenu(item.id)" href="#" 
                           :class="{'active': currentMenu === item.id}"
                           class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                            <i :class="item.icon + ' w-5 text-center'"></i>
                            <span class="font-medium text-sm" x-text="item.label"></span>
                        </a>
                        
                        <!-- Dropdown -->
                        <div x-show="item.sub" class="mb-1">
                            <button @click="item.open = !item.open" class="nav-item w-full flex items-center justify-between px-4 py-3 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                                <div class="flex items-center gap-3">
                                    <i :class="item.icon + ' w-5 text-center'"></i>
                                    <span class="font-medium text-sm" x-text="item.label"></span>
                                </div>
                                <i class="fas fa-chevron-down text-xs transition-transform" :class="{'rotate-180': item.open}"></i>
                            </button>
                            <div x-show="item.open" x-collapse class="pl-11 pr-2 py-1 space-y-1">
                                <template x-for="subItem in item.sub" :key="subItem.id">
                                    <a @click="changeMenu(subItem.id)" href="#" 
                                       :class="{'text-skyblue font-semibold': currentMenu === subItem.id, 'text-gray-500 dark:text-gray-400': currentMenu !== subItem.id}"
                                       class="block py-2 text-sm hover:text-skyblue transition-colors">
                                        <i class="fas fa-minus text-[10px] mr-2 opacity-50"></i> <span x-text="subItem.label"></span>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            
            <!-- Bottom Sidebar -->
            <div class="p-4 border-t border-gray-100 dark:border-gray-700 w-64 min-w-[16rem]">
                <button @click="logout()" class="flex items-center gap-3 w-full px-4 py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition-colors">
                    <i class="fas fa-sign-out-alt w-5 text-center"></i>
                    <span class="font-medium text-sm">Logout</span>
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 flex flex-col min-w-0 bg-gray-50 dark:bg-navy transition-all">
            <!-- TOPBAR -->
            <header class="bg-white dark:bg-darkcard shadow-sm h-16 flex items-center justify-between px-4 lg:px-8 z-30">
                <div class="flex items-center gap-4">
                    <!-- Tombol Trigger Sidebar Show/Hidden (Desktop & Mobile) -->
                    <button @click="sidebarOpen = !sidebarOpen" class="text-gray-500 hover:text-skyblue transition-colors">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-semibold text-gray-800 dark:text-white truncate" x-text="menuTitle"></h1>
                </div>
                <div class="flex items-center gap-4">
                    <button @click="toggleTheme()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-600 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                        <i class="fas" :class="isDark ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                    <div class="hidden sm:flex items-center gap-3 border-l pl-4 dark:border-gray-700">
                        <div class="w-8 h-8 rounded-full bg-skyblue text-white flex items-center justify-center font-bold">A</div>
                        <div class="text-sm">
                            <p class="font-medium leading-none dark:text-white">Admin Utama</p>
                            <p class="text-xs text-gray-500 mt-1">RSUD Bandung Kiwari</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- DYNAMIC VIEWS -->
            <div class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth">
                
                <!-- DASHBOARD -->
                <div x-show="currentMenu === 'dashboard'" x-transition.opacity.duration.300ms>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <!-- Stats Cards -->
                        <div class="bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 border-l-4 border-l-skyblue">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Total Peserta Didik</p>
                                    <h3 class="text-3xl font-bold mt-2 dark:text-white" x-text="stats.didik">Loading...</h3>
                                </div>
                                <div class="w-12 h-12 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center text-skyblue text-xl">
                                    <i class="fas fa-user-graduate"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 border-l-4 border-l-green-500">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Peserta Pelatihan</p>
                                    <h3 class="text-3xl font-bold mt-2 dark:text-white" x-text="stats.pelatihan">Loading...</h3>
                                </div>
                                <div class="w-12 h-12 rounded-full bg-green-50 dark:bg-green-900/30 flex items-center justify-center text-green-500 text-xl">
                                    <i class="fas fa-users-cog"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 border-l-4 border-l-yellow-500">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Peminjaman Aktif</p>
                                    <h3 class="text-3xl font-bold mt-2 dark:text-white" x-text="stats.pinjam">Loading...</h3>
                                </div>
                                <div class="w-12 h-12 rounded-full bg-yellow-50 dark:bg-yellow-900/30 flex items-center justify-center text-yellow-500 text-xl">
                                    <i class="fas fa-handshake"></i>
                                </div>
                            </div>
                        </div>
                        <div class="bg-white dark:bg-darkcard p-6 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 border-l-4 border-l-purple-500">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Total Acara/Sheet</p>
                                    <h3 class="text-3xl font-bold mt-2 dark:text-white" x-text="stats.acara">Loading...</h3>
                                </div>
                                <div class="w-12 h-12 rounded-full bg-purple-50 dark:bg-purple-900/30 flex items-center justify-center text-purple-500 text-xl">
                                    <i class="fas fa-calendar-check"></i>
                <!-- GENERIC DATA VIEW -->
                <div x-show="currentMenu !== 'dashboard'" x-transition.opacity.duration.300ms>
                    <div class="bg-white dark:bg-darkcard rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden flex flex-col h-[calc(100vh-140px)]">
                        
                        <!-- Toolbar -->
                        <div class="p-4 border-b border-gray-100 dark:border-gray-700 flex flex-wrap gap-4 justify-between items-center bg-gray-50/50 dark:bg-gray-800/50">
                            <!-- Bagian Kiri: Search & Filters Dinamis -->
                            <div class="flex flex-wrap gap-2 items-center w-full lg:w-auto flex-1">
                                <div class="relative w-full md:w-64">
                                    <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
                                    <input type="text" x-model="searchQuery" class="w-full pl-9 pr-4 py-2 text-sm border rounded-lg focus:ring-skyblue focus:border-skyblue dark:bg-darkbg dark:border-gray-600 dark:text-white outline-none" :placeholder="activeConfig?.searchPlaceholder || 'Cari data...'">
                                </div>
                                
                                <!-- Multiple Filters Loop -->
                                <template x-for="filter in (activeConfig?.filters || [])" :key="filter.key">
                                    <select x-model="filterValues[filter.key]" class="py-2 px-3 text-sm border rounded-lg dark:bg-darkbg dark:border-gray-600 dark:text-white outline-none focus:ring-skyblue w-full sm:w-auto max-w-[150px] truncate">
                                        <option value="">Semua <span x-text="filter.label"></span></option>
                                        <template x-for="opt in getFilterOptions(filter.key)" :key="opt">
                                            <option :value="opt" x-text="opt"></option>
                                        </template>
                                    </select>
                                </template>
                            </div>

                            <!-- Bagian Kanan: Aksi Toolbar -->
                            <div class="flex flex-wrap gap-2 items-center justify-end">
                                <button @click="fetchData(currentMenu)" class="p-2 text-gray-500 hover:text-skyblue bg-white dark:bg-darkbg border dark:border-gray-600 rounded-lg shadow-sm" title="Reload">
                                    <i class="fas fa-sync-alt" :class="{'animate-spin': isLoading}"></i>
                                </button>
                                
                                <a x-show="activeConfig?.sheetLink" :href="activeConfig?.sheetLink" target="_blank" class="px-3 py-2 text-sm text-green-600 hover:bg-green-50 dark:hover:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-lg flex items-center gap-2 transition-colors whitespace-nowrap">
                                    <i class="fas fa-file-excel"></i> Sheet
                                </a>
                                
                                <!-- Tombol Print (Link HTML Eksternal) -->
                                <a x-show="activeConfig?.printLink" :href="activeConfig?.printLink" target="_blank" class="px-3 py-2 text-sm text-purple-600 hover:bg-purple-50 dark:hover:bg-purple-900/20 border border-purple-200 dark:border-purple-800 rounded-lg flex items-center gap-2 whitespace-nowrap">
                                    <i class="fas fa-print"></i> Print
                                </a>

                                <!-- Tombol Tambah (Berupa Link Eksternal HTML) -->
                                <a x-show="activeConfig?.addLink" :href="activeConfig?.addLink" target="_blank" class="px-4 py-2 text-sm text-white bg-skyblue hover:bg-blue-600 rounded-lg shadow-md flex items-center gap-2 transition-colors whitespace-nowrap">
                                    <i class="fas fa-plus"></i> Tambah Data
                                </a>

                                <!-- Tombol Tambah (Dialog Internal - Untuk Sarpras & Pengaturan) -->
                                <button x-show="!activeConfig?.addLink && activeConfig?.formFields?.length > 0" @click="openModal('add')" class="px-4 py-2 text-sm text-white bg-skyblue hover:bg-blue-600 rounded-lg shadow-md flex items-center gap-2 transition-colors whitespace-nowrap">
                                    <i class="fas fa-plus"></i> Tambah Data
                                </button>
                            </div>
                        </div>

                        <!-- Table -->
                        <div class="flex-1 overflow-auto relative">
                            <div x-show="isLoading" class="absolute inset-0 bg-white/50 dark:bg-navy/50 z-20 flex items-center justify-center backdrop-blur-sm">
                                <div class="w-10 h-10 border-4 border-skyblue border-t-transparent rounded-full animate-spin"></div>
                            </div>
                            
                            <table class="w-full glass-table text-left border-collapse whitespace-nowrap">
                                <thead>
                                    <tr>
                                        <th class="w-12 text-center">No</th>
                                        <template x-for="col in activeConfig?.columns || []" :key="col.key">
                                            <th x-text="col.label"></th>
                                        </template>
                                        <th class="text-right sticky right-0 bg-gray-50 dark:bg-darkbg shadow-[-10px_0_15px_-5px_rgba(0,0,0,0.1)]">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(row, index) in filteredData" :key="index">
                                        <tr>
                                            <td class="text-center" x-text="index + 1"></td>
                                            <template x-for="col in activeConfig?.columns || []" :key="col.key">
                                                <td>
                                                    <!-- Special rendering based on type -->
                                                    <template x-if="col.type === 'image'">
                                                        <img :src="row[col.key] || 'https://placehold.co/100x100/eeeeee/999999?text=No+Img'" class="h-10 w-10 rounded object-cover border dark:border-gray-600 cursor-pointer hover:scale-150 transition-transform origin-left" @click="window.open(row[col.key])">
                                                    </template>
                                                    <template x-if="col.type === 'link'">
                                                        <a :href="row[col.key]" target="_blank" class="text-skyblue hover:underline" x-show="row[col.key]">Lihat File</a>
                                                    </template>
                                                    <template x-if="col.type === 'status'">
                                                        <span class="px-2 py-1 text-xs rounded-full" 
                                                              :class="getStatusClass(row[col.key])" 
                                                              x-text="row[col.key]"></span>
                                                    </template>
                                                    <template x-if="col.type === 'toggle'">
                                                        <label class="relative inline-flex items-center cursor-pointer">
                                                          <input type="checkbox" class="sr-only peer" :checked="row[col.key] === 'OPEN'" @change="toggleStatus(row, col.key)">
                                                          <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-skyblue"></div>
                                                        </label>
                                                    </template>
                                                    <template x-if="!col.type || col.type === 'text'">
                                                        <span x-text="row[col.key]"></span>
                                                    </template>
                                                </td>
                                            </template>
                                            
                                            <!-- MENU AKSI TITIK 3 (Dropdown) -->
                                            <td class="text-right sticky right-0 bg-white dark:bg-darkcard shadow-[-10px_0_15px_-5px_rgba(0,0,0,0.05)] px-4">
                                                <div x-data="{ menuOpen: false }" @click.away="menuOpen = false" class="relative inline-block text-left z-20">
                                                    <button @click="menuOpen = !menuOpen" class="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center text-gray-500 transition-colors">
                                                        <i class="fas fa-ellipsis-v"></i>
                                                    </button>
                                                    <div x-show="menuOpen" x-transition class="absolute right-8 top-0 w-40 bg-white dark:bg-darkbg rounded-lg shadow-xl border border-gray-100 dark:border-gray-700 overflow-hidden text-left" style="display: none;">
                                                        
                                                        <template x-if="activeConfig?.actions?.includes('detail')">
                                                            <a @click="openModal('detail', row); menuOpen=false" class="block px-4 py-2.5 text-sm text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 cursor-pointer border-b dark:border-gray-700 border-gray-50"><i class="fas fa-eye w-5"></i> Detail</a>
                                                        </template>
                                                        
                                                        <template x-if="activeConfig?.actions?.includes('edit')">
                                                            <a @click="openModal('edit', row); menuOpen=false" class="block px-4 py-2.5 text-sm text-yellow-600 hover:bg-yellow-50 dark:hover:bg-yellow-900/20 cursor-pointer border-b dark:border-gray-700 border-gray-50"><i class="fas fa-pen w-5"></i> Edit</a>
                                                        </template>
                                                        
                                                        <template x-if="activeConfig?.actions?.includes('approve') && row.Status === 'PENDING'">
                                                            <a @click="updateStatus(row, 'APPROVED'); menuOpen=false" class="block px-4 py-2.5 text-sm text-green-600 hover:bg-green-50 dark:hover:bg-green-900/20 cursor-pointer border-b dark:border-gray-700 border-gray-50"><i class="fas fa-check w-5"></i> Approve</a>
                                                        </template>
                                                        
                                                        <template x-if="activeConfig?.actions?.includes('delete')">
                                                            <a @click="deleteData(row); menuOpen=false" class="block px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 cursor-pointer"><i class="fas fa-trash w-5"></i> Hapus</a>
                                                        </template>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="filteredData.length === 0 && !isLoading">
                                        <td :colspan="(activeConfig?.columns?.length || 0) + 2" class="text-center py-8 text-gray-500">Tidak ada data ditemukan</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- DYNAMIC FORM MODAL -->
    <div x-show="modalOpen" x-cloak class="fixed inset-0 z-[60] flex items-center justify-center bg-gray-900 bg-opacity-50 backdrop-blur-sm overflow-y-auto pt-10 pb-10">
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-2xl w-full max-w-3xl transform transition-all mx-4 my-auto relative flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center sticky top-0 bg-white dark:bg-darkcard z-10 rounded-t-2xl">
                <h3 class="text-lg font-bold text-navy dark:text-white" x-text="modalTitle"></h3>
                <button @click="closeModal()" class="text-gray-400 hover:text-red-500 w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="dynamicForm" @submit.prevent="saveData">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <template x-for="field in activeConfig?.formFields || []" :key="field.key">
                            <div :class="{'md:col-span-2': field.fullWidth}">
                                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" x-text="field.label"></label>
                                
                                <template x-if="field.type === 'text' || field.type === 'number' || field.type === 'date' || field.type === 'time'">
                                    <input :type="field.type" x-model="formData[field.key]" :disabled="modalMode === 'detail'" class="w-full px-3 py-2 border rounded-lg focus:ring-skyblue focus:border-skyblue dark:bg-darkbg dark:border-gray-600 dark:text-white outline-none disabled:bg-gray-100 dark:disabled:bg-gray-800" :required="field.required">
                                </template>

                                <template x-if="field.type === 'select'">

                // Table Controls
                searchQuery: '',

                init() {
                    // Check dark mode pref
                    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        this.isDark = true;
                        document.documentElement.classList.add('dark');
                    }
                    
                    // Listen to filter and search changes dynamically
                    this.$watch('searchQuery', () => this.applyFilters());
                    this.$watch('filterValues', () => this.applyFilters(), { deep: true });
                    
                    // Auto-hide sidebar on mobile
                    if(window.innerWidth < 768) this.sidebarOpen = false;
                },

                toggleTheme() {
                    this.isDark = !this.isDark;
                    if (this.isDark) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                    }
                    this.renderCharts(); // Re-render charts for color adaptation
                },

                        this.isLoggedIn = true;
                        Swal.fire({
                            toast: true, position: 'top-end', icon: 'success', title: 'Login Berhasil', showConfirmButton: false, timer: 1500
                        });
                        this.loadDashboardData();
                    } else {
                        Swal.fire({ icon: 'error', title: 'Gagal', text: 'Password Salah!' });
                    }
                },
                
                logout() {
                    this.isLoggedIn = false;
                    this.loginPassword = '';
                    this.currentMenu = 'dashboard';
                },

                changeMenu(id) {
                    this.currentMenu = id;
                    // Find title
                    let found = this.menuItems.find(m => m.id === id);
                    if(!found) {
                        this.menuItems.forEach(m => {
                            if(m.sub) {
                                let sub = m.sub.find(s => s.id === id);
                                if(sub) found = sub;
                            }
                        });
                    }
                    this.menuTitle = found ? found.label : 'Dashboard';
                    this.searchQuery = '';
                    this.filterValues = {}; // Reset filters
                    
                    if (window.innerWidth < 768) this.sidebarOpen = false; // Auto close on mobile click

                    if (id === 'dashboard') {
                        this.loadDashboardData();
                    } else if (APP_CONFIG[id]) {
                        this.activeConfig = APP_CONFIG[id];
                        this.fetchData(id);
                    } else {
                        // For unmapped dummy/fallback config in code snippet
                        this.activeConfig = APP_CONFIG['sarpras_barang']; 
                        this.fetchData('sarpras_barang');
                    }
                },

                async callAPI(action, data) {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action, data })
                        });
                        const result = await response.json();
                        if (result.status === 'success') return result.data;
                        throw new Error(result.message);
                    } catch (error) {
                        console.error('API Error:', error);
                        Swal.fire('Error', 'Koneksi ke server gagal: ' + error.message, 'error');
                        return null;
                    }
                },

                async fetchData(configId) {
                    this.isLoading = true;
                    this.rawData = [];
                    this.filteredData = [];
                    
                    let config = APP_CONFIG[configId] || this.activeConfig;
                    
                    const data = await this.callAPI('getData', {
                        module: config.module,
                        sheetName: config.sheetName
                    });
                    
                    if (data) {
                        this.rawData = data;
                        this.applyFilters(); // Setup data awal
                    }
                    this.isLoading = false;
                },

                // Fungsi baru mengambil daftar unik options untuk dropdown filter tertentu
                getFilterOptions(key) {
                    if (!this.rawData || this.rawData.length === 0) return [];
                    return [...new Set(this.rawData.map(item => item[key]).filter(Boolean))].sort();
                },

                applyFilters() {
                    let temp = this.rawData;
                    
                    // Proses Multiple Filter Dinamis
                    if (this.activeConfig?.filters) {
                        this.activeConfig.filters.forEach(filter => {
                            const val = this.filterValues[filter.key];
                            if (val) {
                                temp = temp.filter(item => item[filter.key] === val);
                            }
                        });
                    }
                    
                    // Search Text Global
                    if (this.searchQuery) {
                        const q = this.searchQuery.toLowerCase();
                        temp = temp.filter(item => {
                            return Object.values(item).some(val => 
                                String(val).toLowerCase().includes(q)
                            );
                        });
                    }
                    
                    this.filteredData = temp;
                },

                getStatusClass(status) {
                    if (!status) return 'bg-gray-100 text-gray-800';
                    const s = status.toUpperCase();
                    if (s === 'OPEN' || s === 'APPROVED' || s === 'SELESAI') return 'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400';
                    if (s === 'CLOSE' || s === 'REJECTED' || s === 'CANCEL') return 'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400';
                    if (s === 'PENDING') return 'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400';
                    return 'bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300';
                },

                openModal(mode, rowData = null) {
                    this.modalMode = mode;
                    this.fileUploads = [];
                    
                    if (mode === 'add') {
                        this.modalTitle = 'Tambah ' + this.activeConfig.title;
                        this.formData = {};
                        // Pre-fill some defaults if settings
                        if(this.currentMenu.startsWith('pengaturan')) {
                             this.formData.waktuMulai = new Date().toISOString().slice(0,16).replace('T', ' ');
                        }
                    } else {
                        this.modalTitle = (mode === 'edit' ? 'Edit ' : 'Detail ') + this.activeConfig.title;
                        this.formData = JSON.parse(JSON.stringify(rowData)); // Deep clone
                    }
                    
                    this.modalOpen = true;
                },

                closeModal() {
                    this.modalOpen = false;
                },

                async handleFileUpload(event, key) {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const base64 = e.target.result;
                        // Store for submission
                        this.fileUploads.push({
                            columnName: key,
                            fileName: file.name,
                            base64: base64
                        });
                        // Show preview
                        this.formData[key] = base64;
                    };
                    reader.readAsDataURL(file);
                },

                async saveData() {
                    // Custom Validation for settings
                    if(this.currentMenu.startsWith('pengaturan')) {
                         const start = new Date(this.formData.waktuMulai);
                         const end = new Date(this.formData.waktuSelesai);
                         const now = new Date();
                         if (start < now) {
                             Swal.fire('Error', 'Waktu mulai tidak boleh kurang dari sekarang', 'error'); return;
                         }
                         if (end <= start) {
                             Swal.fire('Error', 'Waktu selesai harus lebih besar dari waktu mulai', 'error'); return;
                         }
                    }

                    this.isSaving = true;
                    
                    // Construct payload for GAS
                    const payload = {
                        module: this.activeConfig.module,
                        sheetName: this.activeConfig.sheetName || this.formData._sheetName || 'Sheet1', // Ensure target sheet is defined
                        rowData: this.formData,
                        rowIndex: this.modalMode === 'edit' ? this.formData._rowIndex : null,
                        files: this.fileUploads,
                        // Determine Drive Folder Mapping logically
                        folderType: this.currentMenu === 'didik' ? 'DOK_DIDIK' : 
                                    this.currentMenu === 'pelatihan' ? 'DOK_PELATIHAN' :
                                    this.currentMenu === 'sarpras_barang' ? 'FOTO_BARANG' : 'DOK_DIDIK', // Default fallback
                        // Dynamic subfolder names (e.g. SheetName / Nim+Nama)
                        subFolderStruct: [this.formData._sheetName, (this.formData.nim ? this.formData.nim + '_' + this.formData.nama : null)]
                    };

                    // Special Case: Creating new Setting creates a new Sheet
                    if (this.currentMenu.startsWith('pengaturan') && this.modalMode === 'add') {
                        const templateMap = { 'pengaturan_pd': 'TEMPLATE_PD', 'pengaturan_pl': 'TEMPLATE_PL'};
                        await this.callAPI('createSheetFromTemplate', {
                            targetModule: this.activeConfig.module === 'PENGATURAN' ? (this.currentMenu === 'pengaturan_pd' ? 'PESERTA_DIDIK' : 'PESERTA_PELATIHAN') : 'PESERTA_DIDIK',
                            templateName: templateMap[this.currentMenu],
                            newSheetName: this.formData.newSheetName,
                            settingSheetName: this.activeConfig.sheetName,
                            settingRowData: [this.rawData.length + 1, this.formData.newSheetName, this.formData.namaAcara, this.formData.tempat, this.formData.waktuMulai, this.formData.waktuSelesai, 'OPEN']
                        });
                        Swal.fire('Berhasil', 'Acara dan Sheet baru berhasil dibuat!', 'success');
                    } else {
                        // Standard CRUD
                        const result = await this.callAPI('saveData', payload);
                        if (result) {
                            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Data tersimpan', showConfirmButton: false, timer: 1500 });
                        }
                    }

                    this.isSaving = false;
                    this.closeModal();
                    this.fetchData(this.currentMenu);
                },

                async deleteData(row) {
                    const result = await Swal.fire({
                        title: 'Yakin hapus data?',
                        text: "Data yang dihapus (termasuk file di Drive) tidak dapat dikembalikan!",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#ef4444',
                        cancelButtonColor: '#94a3b8',
                        confirmButtonText: 'Ya, Hapus!'
                    });

                    if (result.isConfirmed) {
                        // Menggunakan custom fileColumns mapping (seperti yang diminta di Catatan: Kolom B dan W dihapus)
                        const fileCols = this.activeConfig.fileColumns || this.activeConfig.formFields.filter(f => f.type === 'image' || f.type === 'file').map(f => f.key);
                        
                        await this.callAPI('deleteData', {
                            module: this.activeConfig.module,
                            sheetName: row._sheetName || this.activeConfig.sheetName,
                            rowIndex: row._rowIndex,
                            fileColumns: fileCols 
                        });
                        
                        Swal.fire('Terhapus!', 'Data telah dihapus.', 'success');
                        this.fetchData(this.currentMenu);
                    }
                },
                
                async toggleStatus(row, key) {
                     // For fast toggle (e.g. Open/Close in settings)
                     row[key] = row[key] === 'OPEN' ? 'CLOSE' : 'OPEN';
                     // Logic to save just this change...
                     // (Simplified for demo)
                     Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Status diubah', showConfirmButton: false, timer: 1000 });
                },

                async loadDashboardData() {
                    // Simulating fetching summary data for dashboard
                    this.stats = { didik: 125, pelatihan: 48, pinjam: 12, acara: 8 };
                    this.$nextTick(() => { this.renderCharts(); });
                },

                renderCharts() {
                    const textColor = this.isDark ? '#e2e8f0' : '#475569';
                    const gridColor = this.isDark ? '#334155' : '#e2e8f0';

                    if(this.charts.institusi) this.charts.institusi.destroy();
                    const ctx1 = document.getElementById('chartInstitusi');
                    if(ctx1) {
                        this.charts.institusi = new Chart(ctx1, {
                            type: 'doughnut',
                            data: {
                                labels: ['UNPAD', 'ITB', 'UPI', 'Lainnya'],
                                datasets: [{ data: [45, 25, 20, 10], backgroundColor: ['#0ea5e9', '#3b82f6', '#8b5cf6', '#cbd5e1'] }]
                            },
                            options: { plugins: { legend: { position: 'right', labels: { color: textColor } } } }
                        });
                    }

                    if(this.charts.jurusan) this.charts.jurusan.destroy();
                    const ctx2 = document.getElementById('chartJurusan');
                    if(ctx2) {
                        this.charts.jurusan = new Chart(ctx2, {
                            type: 'bar',
                            data: {
                                labels: ['Keperawatan', 'Farmasi', 'Gizi', 'Bidan', 'Manajemen'],
                                datasets: [{ label: 'Jumlah', data: [35, 20, 15, 25, 10], backgroundColor: '#0ea5e9' }]
                            },
                            options: { scales: { y: { grid: { color: gridColor }, ticks: { color: textColor } }, x: { grid: { display: false }, ticks: { color: textColor } } }, plugins: { legend: { display: false } } }
                        });
                    }
                },
                
                printCard() {
                    // Logic to open a new window and print ID cards based on filteredData
                    const printWindow = window.open('', '_blank');
                    let html = '<html><head><title>Print ID Card</title><style>body{font-family:sans-serif;} .card{border:1px solid #000; width:5.5cm; height:8.5cm; padding:10px; text-align:center; float:left; margin:10px; border-radius:8px;} img{width:80px;height:80px;object-fit:cover;border-radius:50%;margin-bottom:10px;}</style></head><body>';
                    this.filteredData.forEach(row => {
                        html += `<div class="card">
                            <h3>RSUD Bandung Kiwari</h3>
                            <img src="${row.pasfoto || 'https://placehold.co/100x100?text=Foto'}">
                            <h4 style="margin:5px 0">${row.nama || '-'}</h4>
                            <p style="font-size:12px;margin:2px">${row.Institusi || row.profesi || '-'}</p>
                            <p style="font-size:12px;margin:2px">${row.nim || row.nik || '-'}</p>
                        </div>`;
                    });
                    html += '</body></html>';
                    printWindow.document.write(html);
                    printWindow.document.close();
                    setTimeout(() => { printWindow.print(); }, 500);
                }
            }));
        });
    </script>
</body>
</html>
